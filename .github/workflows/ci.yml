name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: go
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  frontend:
    name: frontend
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  # The daemon, CLI and app on Linux: tests with the GTK/WebKitGTK headers
  # (the app's webview), then the AppImage and .deb release.yml publishes.
  linux:
    name: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: GTK and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go vet -tags webkit2_41 ./...
      - run: go test -race -tags webkit2_41 ./...
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - name: Package (AppImage, deb)
        run: scripts/package-linux.sh 0.0.0-ci
      - uses: actions/upload-artifact@v7
        with:
          name: linux-amd64
          path: |
            dist/*.AppImage
            dist/*.deb
          retention-days: 7
