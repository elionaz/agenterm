name: Linux app

# The desktop app on Linux: its tests with the GTK/WebKitGTK headers, the
# build and the AppImage/.deb (as release.yml makes them). Only when a change
# can affect it; ci.yml's linux job tests the daemon and CLI on every change.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "app/**"
      - "packaging/**"
      - "scripts/package-linux.sh"
      - "internal/linuxnotify/**"
      - ".github/workflows/**"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

jobs:
  linux-app:
    name: linux-app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      # The .debs apt downloads (WebKitGTK pulls in a lot), kept between runs.
      - uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ runner.arch }}-gtk3-webkit41-${{ hashFiles('.github/workflows/linux-app.yml') }}
      - name: GTK and WebKitGTK
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-archives" \
            libgtk-3-dev libwebkit2gtk-4.1-dev
          sudo chown -R "$USER" ~/apt-archives
      - run: go vet -tags webkit2_41 ./app/...
      - run: go test -race -tags webkit2_41 ./app/...
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - name: Package (AppImage, deb)
        run: scripts/package-linux.sh 0.0.0-ci
      - uses: actions/upload-artifact@v7
        with:
          name: linux-amd64
          path: |
            dist/*.AppImage
            dist/*.deb
          retention-days: 7
