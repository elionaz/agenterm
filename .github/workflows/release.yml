name: Release

# Push a vX.Y.Z tag to build, sign/notarize (when the secrets exist), publish a
# GitHub release and update the Homebrew cask. Run it by hand
# (workflow_dispatch) for a dry run: it builds and uploads the artifacts to the
# run, but publishes nothing. See docs/development.md#releasing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (dry run, nothing is published), e.g. 0.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then v=${GITHUB_REF_NAME#v}; else v=${INPUT_VERSION#v}; fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::invalid version '$v' (expected X.Y.Z)"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version $v (publish: $PUBLISH)"

      - name: Detect optional secrets
        id: secrets
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY || secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          if [ -z "$SPARKLE_PUBLIC_ED_KEY" ]; then
            echo "::warning::SPARKLE_PUBLIC_ED_KEY (variable or secret) not set: the app is built with in-app updates off"
          fi
          if [ -z "$SPARKLE_PRIVATE_ED_KEY" ]; then
            echo "::warning::SPARKLE_PRIVATE_ED_KEY not set: no appcast.xml, existing installs will not be offered this update"
          fi
          sign=false; notarize=false; tap=false
          if [ -n "$MACOS_CERT_P12_BASE64" ] && [ -n "$MACOS_CERT_PASSWORD" ]; then sign=true; fi
          if $sign && [ -n "$APPLE_API_KEY_ID" ] && [ -n "$APPLE_API_ISSUER_ID" ] && [ -n "$APPLE_API_KEY_P8_BASE64" ]; then notarize=true; fi
          if [ -n "$HOMEBREW_TAP_TOKEN" ]; then tap=true; fi
          if [ $sign = false ]; then
            echo "::warning::MACOS_CERT_P12_BASE64/MACOS_CERT_PASSWORD not set: the app will be ad-hoc signed (unsigned release)"
          elif [ $notarize = false ]; then
            echo "::warning::APPLE_API_* secrets not set: the app will be signed but not notarized"
          fi
          if [ $tap = false ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set: the Homebrew cask will not be updated"
          fi
          { echo "sign=$sign"; echo "notarize=$notarize"; echo "tap=$tap"; } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      # The pinned Sparkle tarball (scripts/fetch-sparkle.sh re-checks its
      # SHA-256 on every run).
      - uses: actions/cache@v4
        with:
          path: .cache/sparkle/*.tar.xz
          key: sparkle-${{ hashFiles('scripts/fetch-sparkle.sh') }}

      - name: Import signing certificate
        if: steps.secrets.outputs.sign == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          kc="$RUNNER_TEMP/agenterm-signing.keychain-db"
          kcpw=$(openssl rand -hex 24)
          echo "::add-mask::$kcpw"
          p12="$RUNNER_TEMP/cert.p12"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpw" "$kc" > /dev/null
          # Prepend to the search list so codesign finds the identity.
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          identity="$MACOS_SIGN_IDENTITY"
          if [ -z "$identity" ]; then
            identity=$(security find-identity -v -p codesigning "$kc" | awk '/Developer ID Application/ {print $2; exit}')
          fi
          if [ -z "$identity" ]; then
            echo "::error::no 'Developer ID Application' identity in the imported certificate"; exit 1
          fi
          { echo "SIGN_IDENTITY=$identity"; echo "SIGN_KEYCHAIN=$kc"; } >> "$GITHUB_ENV"

      - name: Prepare notarization key
        if: steps.secrets.outputs.notarize == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          { echo "NOTARY_KEY_PATH=$key"; echo "NOTARY_KEY_ID=$APPLE_API_KEY_ID"; echo "NOTARY_ISSUER_ID=$APPLE_API_ISSUER_ID"; } >> "$GITHUB_ENV"

      - name: Build, sign and package
        id: build
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY || secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_KEY_ROTATION: ${{ vars.SPARKLE_KEY_ROTATION }}
        run: scripts/release-local.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: agenterm-${{ steps.ver.outputs.version }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.tar.gz
            dist/checksums.txt
            dist/appcast.xml
          if-no-files-found: error

      - name: Release notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          SIGNED: ${{ steps.build.outputs.signed }}
          NOTARIZED: ${{ steps.build.outputs.notarized }}
        run: |
          # The "## [X.Y.Z]" section of CHANGELOG.md, if any (without link references).
          awk -v v="$VERSION" '
            /^## \[/ { if (on) exit; on = index($0, "## [" v "]") == 1; next }
            /^\[[^]]+\]: / { next }
            on' CHANGELOG.md > "$RUNNER_TEMP/changelog.md" || true
          {
            echo "> agenterm is at an early stage: expect rough edges and breaking changes between 0.x releases."
            echo
            if [ "$SIGNED" != true ]; then
              echo "> **Unsigned build.** This release is not signed with a Developer ID nor notarized, so macOS"
              echo "> Gatekeeper will refuse to open it. After moving \`agenterm.app\` to \`/Applications\`, run"
              echo "> \`xattr -dr com.apple.quarantine /Applications/agenterm.app\`."
              echo
            elif [ "$NOTARIZED" != true ]; then
              echo "> **Not notarized.** Signed with a Developer ID but not notarized: Gatekeeper may ask for confirmation."
              echo
            fi
            cat "$RUNNER_TEMP/changelog.md"
            echo
            echo "Install with Homebrew: \`brew install --cask elionaz/tap/agenterm\`, or download the \`.dmg\`/\`.zip\` below."
            echo "The \`agenterm\` CLI is inside the app (\`Contents/Helpers/agenterm\`) and in the \`.tar.gz\` archives; verify downloads with \`checksums.txt\`."
          } > "$RUNNER_TEMP/notes.md"
          if [ -s "$RUNNER_TEMP/changelog.md" ]; then echo "GENERATE_NOTES=false" >> "$GITHUB_ENV"; else echo "GENERATE_NOTES=true" >> "$GITHUB_ENV"; fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          APPCAST: ${{ steps.build.outputs.appcast }}
          NOTARIZED: ${{ steps.build.outputs.notarized }}
        run: |
          gen=()
          if [ "$GENERATE_NOTES" = true ]; then gen=(--generate-notes); fi
          # appcast.xml as a release asset is what SUFeedURL
          # (releases/latest/download/appcast.xml) serves. Only notarized
          # builds are offered to existing installs: Sparkle would install
          # an unnotarized one that Gatekeeper then refuses to open.
          #
          # A release without appcast.xml must not become "Latest": the
          # feed URL would 404 for every installed app until the next one.
          # Pre-releases (X.Y.Z-suffix) are never Latest nor offered in-app.
          feed=() flags=()
          if [[ "$VERSION" == *-* ]]; then
            flags=(--prerelease --latest=false)
            echo "::notice::pre-release: not offered in-app, not Latest, Homebrew cask untouched"
          elif [ "$APPCAST" = true ] && [ "$NOTARIZED" = true ]; then
            feed=(dist/appcast.xml)
          else
            flags=(--latest=false)
            echo "::warning::no appcast.xml (not notarized or no Sparkle key): this release is not marked Latest and not offered in-app"
          fi
          gh release create "v$VERSION" --verify-tag --title "agenterm $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" "${gen[@]}" "${flags[@]}" \
            dist/*.zip dist/*.dmg dist/*.tar.gz dist/checksums.txt "${feed[@]}"

      - name: Update Homebrew cask
        if: env.PUBLISH == 'true' && steps.secrets.outputs.tap == 'true' && !contains(steps.ver.outputs.version, '-')
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          ZIP_SHA256: ${{ steps.build.outputs.zip_sha256 }}
          SIGNED: ${{ steps.build.outputs.signed }}
        run: |
          tap="$RUNNER_TEMP/homebrew-tap"
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/elionaz/homebrew-tap.git" "$tap"
          mkdir -p "$tap/Casks"
          scripts/render-cask.sh "$VERSION" "$ZIP_SHA256" "$SIGNED" > "$tap/Casks/agenterm.rb"
          ruby -c "$tap/Casks/agenterm.rb"
          cd "$tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/agenterm.rb
          if git diff --cached --quiet; then echo "cask already up to date"; exit 0; fi
          git commit -m "agenterm $VERSION"
          git push origin HEAD

      - name: Clean up signing material
        if: always()
        run: |
          if [ -n "${SIGN_KEYCHAIN:-}" ]; then security delete-keychain "$SIGN_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
